<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réalisation</title>
  <meta name="description" content="Fiche détaillée d'une réalisation professionnelle — BTS SIO SISR." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="content.js"></script>
  <script>
    // Applique le thème, la palette et le fond avant le rendu (évite un flash).
    // Aperçu : ?palette=bleu|ambre|violet|rouge  &fond=grille|degrade|reseau|ondes|particules|aucun
    //          &avatar=illustration|pochoir|crayon|photo  &theme=light|dark
    (function () {
      const r = document.documentElement;
      const a = (window.PORTFOLIO && window.PORTFOLIO.apparence) || {};
      const q = new URLSearchParams(location.search);
      const pick = (k, def) => {
        let v = q.get(k);
        try {
          if (v) sessionStorage.setItem("apercu-" + k, v);
          else v = sessionStorage.getItem("apercu-" + k);
        } catch (e) {}
        return v || def;
      };
      r.dataset.palette = pick("palette", a.palette || "bleu");
      r.dataset.fond = pick("fond", a.fond || "grille");
      r.dataset.avatar = pick("avatar", a.avatar || "photo");
      r.dataset.police = pick("police", a.police || "inter");
      try { if (localStorage.getItem("dys") === "1") r.dataset.dys = "1"; } catch (e) {}
      try {
        const t = q.get("theme") || localStorage.getItem("theme");
        if (t) r.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="nav scrolled" id="top">
    <div class="container nav__inner">
      <a class="nav__brand" href="index.html">~/portfolio</a>

        <span></span><span></span>
      </button>
      <nav class="nav__links" id="navLinks" aria-label="Navigation principale">
        <a href="index.html#apropos">À propos</a>
        <a href="index.html#competences">Compétences</a>
        <a href="index.html#projets" class="active">Réalisations</a>
        <a href="index.html#veille">Veille</a>
        <a href="index.html#parcours">Parcours</a>
        <a href="index.html#contact">Contact</a>
        <button class="theme-btn dys-btn" id="dysBtn" type="button" aria-pressed="false" title="Police adaptée à la dyslexie (OpenDyslexic)">Aa</button>
        <button class="theme-btn" id="themeBtn" aria-label="Changer de thème" title="Changer de thème">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>

  <main id="main" class="container fiche">
    <a class="back mono" href="index.html#projets">← Toutes les réalisations</a>

  </main>

  <dialog class="modal modal--doc" id="docModal" aria-label="Aperçu du document">
    <button class="modal__close" id="docClose" type="button" aria-label="Fermer">✕</button>

  </dialog>

  <footer class="footer">

      <a href="#top">Retour en haut ↑</a>
    </div>

  <script src="common.js"></script>
  <script src="realisation.js"></script>
</body>
</html>
